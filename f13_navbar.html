<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="arya"/>
    <title>Flex Box</title>
    <link rel="stylesheet" href="" />
    <style>
         @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Geist+Pixel&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }
         body{
            min-height: 100dvh;
            font-family: "Segoe UI", sans-serif;
            font-size: 16px;
            background-color: white;
            color: white;
         }
         section {
            padding: 10px;
          }
         .box {
              background-color: rgb(161, 186, 207);
          }
          /* flex controller */
          .fc {

            display: flex;
            gap: 10px;
            flex-direction: row;
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: center;
            align-items: flex-start;
            align-items: flex-end;
            align-items: center;
          }
          /* footer {
            position:absolute;
            bottom:0px;
          } */

     </style>
</head>
<body>
    <section class="box" style="height: 10vh;">Header/Navbar</section>
    <section class="fc" style="height: 80vh; background-color: white">
        <main class="box" style="height: 150px; width:200px; padding: 10px">
            Main - 1
        </main>

        <main class = "box" style ="height: 150px; width: 200px; padding: 10px">

            Main 2
        </main>
    </section>

    <!-- <section
        class="box"
        style="height: 80vh; background-color: white;"
    </section> -->

    <section
    class="box"
    style="position:absolute; bottom:  0; left: 0; height: 10vh; width: 100%";
      >
     footer
    </section>
        <script></script>
    
</body>
</html>
