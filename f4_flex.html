<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Grid Layout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background-color: rgb(249, 249, 217);
}

/* Main Container */

.container{
    display:grid;
    grid-template-rows:80px 1fr 70px;
    height:100vh;
}

/* Header */

header{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.logo,
.links{
    background-color: rgb(241, 172, 224);
    border:1px solid black;
    padding:20px;
}

/* Main */

main{
    border:1px solid black;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Box Container */

.box-container{
    display:flex;
    gap:40px;
}

/* Small Boxes */

.box{
    width:150px;
    height:150px;
    background:royalblue;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:18px;
    font-weight:bold;
}

/* Footer */

footer{
    background-color:  rgb(230, 197, 221);
    display:grid;
    grid-template-columns:1fr 1fr;
}

.footer1,
.footer2{
    border:1px solid black;
    padding:20px;
}

</style>

</head>

<body>

<div class="container">

    <header>
        <div class="logo">Logo</div>
        <div class="links">Links</div>
    </header>

    <main>

        <div class="box-container">

            <div class="box">
                Small Box
            </div>

            <div class="box">
                Small Box
            </div>

        </div>

    </main>

    <footer>
        <div class="footer1">Footer1</div>
        <div class="footer2">Footer2</div>
    </footer>

</div>

</body>
</html>
