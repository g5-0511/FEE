<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

   
    <meta name="author" content="Arya">
    <meta name="description" content="Create Login Form">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
       @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Geist+Pixel&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
       
       
        *{ 
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background-color:rgb(0, 0, 0);
            /* font-family:'Courgette', cursive; */

            display:flex;
            justify-content:center;
            align-items:center;
        }

        section{
            width:20rem;
            background-color:rgb(81, 90, 89);
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 10px rgb(199, 102, 184);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            font-size:18px;
        }

        input{
            width:100%;
            height:40px;
            padding:8px 10px;
            margin-top:5px;
            margin-bottom:15px;

            border:none;
            outline:none;
            border-radius:8px;

            background-color:rgb(238, 186, 227);
            font-size:16px;
        }

        input::placeholder{
            color:#555;
        }

        button{
            width:100%;
            height:42px;

            border:none;
            border-radius:8px;

            background-color:rgb(215, 85, 176);
            color:white;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background-color:rgb(100, 33, 72);
        }
    </style>
</head>

<body>

    <section>

        <form action="#" method="post">

            <h2>Login</h2>

            <label for="email">Email</label><br>
            <input
                type="email"
                id="email"
                name="email"
                
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label><br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                minlength="6"
                maxlength="8"
                required
            >
            <br /><br />

            <button type="submit">Submit</button>

        </form>

    </section>

</body>
</html>
